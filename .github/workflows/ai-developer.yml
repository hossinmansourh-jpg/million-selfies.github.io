name: AI Developer Agent

on:
  issues:
    types: [opened, labeled]

jobs:
  ai-fix-and-feature:
    if: contains(github.event.issue.labels.*.name, 'ai-fix') || contains(github.event.issue.labels.*.name, 'ai-feature')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run AI Agent Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install @google/generative-ai
          node .github/scripts/ai_agent.js

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Fix/Feature generated by AI Agent for Issue #${{ github.event.issue.number }}"
          title: "🤖 [AI Auto-Fix] ${{ github.event.issue.title }}"
          body: "تم تعديل الكود تلقائياً بواسطة الوكيل الاصطناعي للمشكلة رقم #${{ github.event.issue.number }}."
          branch: "ai-fix-issue-${{ github.event.issue.number }}"
