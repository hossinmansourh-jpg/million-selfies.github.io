name: AI Developer Agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-fix-and-feature:
    if: github.event.label.name == 'ai-fix'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - List Files
        run: |
          echo "📁 الملفات في الجذر:"
          ls -la
          echo ""
          echo "📁 الملفات في .github/scripts:"
          ls -la .github/scripts/ || echo "❌ المجلد غير موجود!"
          echo ""
          echo "🔍 البحث عن ai_agent.js:"
          find . -name "ai_agent.js" 2>/dev/null || echo "❌ الملف غير موجود!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install @google/generative-ai @octokit/rest

      - name: Run AI Agent Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node ai_agent.js
