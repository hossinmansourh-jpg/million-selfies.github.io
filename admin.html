<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الجدارية - إدارة الصور</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #d4af37; text-align: center; border-bottom: 2px solid #d4af37; padding-bottom: 10px; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background-color: #222;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(212, 175, 55, 0.1);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #444;
        }
        .info { margin: 10px 0; font-size: 14px; }
        .info span { color: #d4af37; font-weight: bold; }
        .actions { display: flex; gap: 10px; margin-top: 15px; }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
        }
        .btn-approve { background-color: #d4af37; color: #111; }
        .btn-approve:hover { background-color: #fff; }
        .btn-reject { background-color: #ff4d4d; color: #fff; }
        .btn-reject:hover { background-color: #ff1a1a; }
        .no-data { text-align: center; color: #888; grid-column: 1 / -1; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>إدارة طلبات حجز المربعات (تحت المراجعة)</h1>
    
    <div class="grid-container" id="requestsGrid">
        <p class="no-data">جاري تحميل الطلبات المعلقة...</p>
    </div>

    <!-- ربط مكتبات Firebase (تأكد من مطابقة الإصدارات المستخدمة في test.html) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // إعدادات Firebase الخاصة بمشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyCEMxWCT0siwT2t72CX24N1ajSAwqEk7Fs",
            authDomain: "million-selfies.firebaseapp.com", // تصحيح الرابط تلقائياً بناءً على الـ projectId
            projectId: "million-selfies",
            storageBucket: "million-selfies.firebasestorage.app",
            messagingSenderId: "1016907817387",
            appId: "1:1016907817387:web:f6e9b2b76dcaecebe4b2ee"
        };

        // تهيئة الـ SDK
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const requestsGrid = document.getElementById('requestsGrid');

        // جلب البيانات المعلقة (التي تنتظر المراجعة) تلقائياً وفي الوقت الحقيقي
        db.collection("reservations").where("status", "==", "pending")
        .onSnapshot((querySnapshot) => {
            requestsGrid.innerHTML = "";
            
            if (querySnapshot.empty) {
                requestsGrid.innerHTML = '<p class="no-data">🎉 لا توجد طلبات معلقة بانتظار المراجعة حالياً.</p>';
                return;
            }

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <img src="${data.imageUrl || 'https://placeholder.com'}" alt="سيلفي">
                    <div class="info">📌 الإحداثيات: سطر <span>${data.row}</span>، عمود <span>${data.col}</span></div>
                    <div class="info">👤 الاسم/الرسالة: <span>${data.userName || 'غير محدد'}</span></div>
                    <div class="actions">
                        <button class="btn-approve" onclick="updateStatus('${doc.id}', 'approved')">قبول ونشر</button>
                        <button class="btn-reject" onclick="updateStatus('${doc.id}', 'rejected')">رفض الطلب</button>
                    </div>
                `;
                requestsGrid.appendChild(card);
            });
        }, (error) => {
            console.error("خطأ في جلب البيانات: ", error);
            requestsGrid.innerHTML = '<p class="no-data" style="color:red;">فشل تحميل البيانات. تأكد من إعدادات القواعد (Rules) في Firebase.</p>';
        });

        // دالة تحديث حالة الصورة (قبول أو رفض)
        function updateStatus(docId, newStatus) {
            db.collection("reservations").doc(docId).update({
                status: newStatus,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert(newStatus === 'approved' ? "🟢 تم قبول الصورة وستظهر على الجدارية!" : "🔴 تم رفض الطلب بنجاح.");
            })
            .catch((error) => {
                console.error("خطأ أثناء التحديث: ", error);
                alert("حدث خطأ أثناء معالجة الطلب.");
            });
        }
    </script>
</body>
</html>
