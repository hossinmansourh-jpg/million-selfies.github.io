<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدارية مليون سيلفي | Million Selfie Wall</title>
    <!-- استدعاء خطوط Google لجعل المظهر احترافي جداً -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f1f5f9;
            --accent-color: #f59e0b;
            --grid-line: #1e293b;
            --primary-font: 'Cairo', sans-serif;
        }

        html[dir="ltr"] {
            --primary-font: 'Poppins', sans-serif;
        }

        body {
            font-family: var(--primary-font);
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top, #1e1b4b 0%, #0b0f19 70%);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        /* شريط علوي أنيق */
        .top-bar {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        /* زر تبديل اللغة */
        .lang-switch-btn {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        
        .lang-switch-btn:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }

        /* الهيدر والعناوين */
        header {
            text-align: center;
            margin-bottom: 25px;
            max-width: 600px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }

        p.subtitle {
            font-size: 1.1rem;
            opacity: 0.85;
            margin: 0;
            line-height: 1.6;
        }

        /* لوحة العرض التفاعلية المباشرة (Live Preview Box) */
        .live-preview-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.95rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: pulse 2s infinite alternate;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        /* لوحة التحكم والعدادات المتقدمة */
        .dashboard {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            box-sizing: border-box;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.6);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .counter-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
            display: block;
        }

        .counter-label {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* شريط التقدم النيون */
        .progress-container {
            background-color: #0f172a;
            border-radius: 12px;
            height: 24px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 12px;
            border: 1px solid var(--grid-line);
            position: relative;
        }

        .progress-bar {
            background: linear-gradient(90deg, #f59e0b, #ef4444, #ec4899);
            width: 4.5%;
            height: 100%;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .percentage-text {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.3rem;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
        }

        /* زر الحجز المضيء */
        .cta-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: var(--primary-font);
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }

        /* جدارية الشبكة للمربعات */
        .grid-container {
            background-color: rgba(30, 41, 59, 0.4);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            margin-bottom: 40px;
            border: 1px solid rgba(255,255,255,0.05);
            max-width: 100%;
            overflow: auto;
        }

        .pixel-grid {
            display: grid;
            grid-template-columns: repeat(25, 14px);
            grid-template-rows: repeat(25, 14px);
            gap: 2px;
            background-color: #0b0f19;
            padding: 6px;
            border: 1px solid var(--grid-line);
        }

        .pixel {
            background-color: #131c2e;
            border-radius: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pixel:hover {
            background-color: var(--accent-color) !important;
            box-shadow: 0 0 12px var(--accent-color);
            transform: scale(1.3);
            z-index: 10;
        }

        /* المربعات المحجوزة مسبقاً */
        .pixel.taken-vip { background-color: #ec4899; } 
        .pixel.taken-user { background-color: #3b82f6; } 
        .pixel.taken-gold { background-color: #eab308; } 

        /* ذيل الصفحة */
        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.85rem;
            opacity: 0.6;
            text-align: center;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 5px rgba(245, 158, 11, 0.2); }
            100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="lang-switch-btn" id="langBtn" onclick="toggleLanguage()">English</button>
    </div>

    <header>
        <h1 id="mainTitle">جدارية مليون سيلفي</h1>
        <p class="subtitle" id="subTitle">احجز مربعك في أكبر لوحة رقمية للتاريخ</p>
    </header>

    <div class="live-preview-box">
        <span class="live-dot"></span>
        <span id="liveStatus">اضغط على أي مربع في الشبكة بالأسفل لاختياره</span>
    </div>

    <div class="dashboard">
        <div class="stats-grid">
            <div class="stat-card">
                <span class="counter-label" id="lblRemaining">المربعات المتبقية</span>
                <span class="counter-value" id="valRemaining">999,542</span>
            </div>
            <div class="stat-card">
                <span class="counter-label" id="lblReserved">المربعات المحجوزة</span>
                <span class="counter-value" id="valReserved">458</span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="percentage-text" id="percentText">0.045%</div>
        
        <button class="cta-btn" id="ctaBtn" onclick="bookPixelAlert()">احجز مكانك في الجدارية الآن 🚀</button>
    </div>

    <div class="grid-container">
        <div class="pixel-grid" id="pixelGrid"></div>
    </div>

    <footer>
        <span id="footerText">&copy; 2026 جدارية مليون سيلفي. جميع الحقوق محفوظة.</span>
    </footer>
