<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدارية مليون سيلفي | Million Selfie Wall</title>
    <!-- استدعاء خطوط Google لجعل المظهر احترافي جداً -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f1f5f9;
            --accent-color: #f59e0b;
            --grid-line: #1e293b;
            --primary-font: 'Cairo', sans-serif;
        }

        html[dir="ltr"] {
            --primary-font: 'Poppins', sans-serif;
        }

        body {
            font-family: var(--primary-font);
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top, #1e1b4b 0%, #0b0f19 70%);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        /* شريط علوي أنيق */
        .top-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        /* زر تبديل اللغة المضمون */
        .lang-switch-btn {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 999;
        }
        
        .lang-switch-btn:hover {
            background: var(--accent-color);
            color: #000;
        }

        /* الهيدر والعناوين */
        header {
            text-align: center;
            margin-bottom: 25px;
            max-width: 600px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }

        p.subtitle {
            font-size: 1.1rem;
            opacity: 0.85;
            margin: 0;
            line-height: 1.6;
        }

        /* لوحة العرض التفاعلية المباشرة */
        .live-preview-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.95rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        /* لوحة التحكم والعدادات المتقدمة */
        .dashboard {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            box-sizing: border-box;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.6);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .counter-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
            display: block;
        }

        .counter-label {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* شريط التقدم النيون */
        .progress-container {
            background-color: #0f172a;
            border-radius: 12px;
            height: 24px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 12px;
            border: 1px solid var(--grid-line);
        }

        .progress-bar {
            background: linear-gradient(90deg, #f59e0b, #ef4444, #ec4899);
            width: 4.5%; /* ثابتة كـ CSS لضمان الظهور الفوري */
            height: 100%;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .percentage-text {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.3rem;
        }

        /* زر الحجز المضيء */
        .cta-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: var(--primary-font);
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        /* جدارية الشبكة للمربعات */
        .grid-container {
            background-color: rgba(30, 41, 59, 0.4);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            margin-bottom: 40px;
            border: 1px solid rgba(255,255,255,0.05);
            width: 100%;
            max-width: 450px;
            overflow: auto;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .pixel-grid {
            display: grid;
            grid-template-columns: repeat(25, 15px);
            grid-template-rows: repeat(25, 15px);
            gap: 2px;
            background-color: #0b0f19;
            padding: 6px;
            border: 1px solid var(--grid-line);
            width: max-content;
            margin: 0 auto;
        }

        .pixel {
            background-color: #131c2e;
            border-radius: 2px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .pixel:hover {
            transform: scale(1.15);
        }

        /* المربعات المحجوزة مسبقاً */
        .pixel.taken-vip { background-color: #ec4899; } 
        .pixel.taken-user { background-color: #3b82f6; } 
        .pixel.taken-gold { background-color: #eab308; } 
        .pixel.selected { 
            background-color: #10b981; 
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
        }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.85rem;
            opacity: 0.6;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="lang-switch-btn" id="langBtn" onclick="toggleLanguage()">English</button>
    </div>

    <header>
        <h1 id="mainTitle">جدارية مليون سيلفي</h1>
        <p class="subtitle" id="subTitle">احجز مربعك في أكبر لوحة رقمية للتاريخ</p>
    </header>

    <div class="live-preview-box">
        <span class="live-dot"></span>
        <span id="liveStatus">اضغط على أي مربع في الشبكة بالأسفل لاختياره</span>
    </div>

    <div class="dashboard">
        <div class="stats-grid">
            <div class="stat-card">
                <span class="counter-label" id="lblRemaining">المربعات المتبقية</span>
                <span class="counter-value" id="valRemaining">999,542</span>
            </div>
            <div class="stat-card">
                <span class="counter-label" id="lblReserved">المربعات المحجوزة</span>
                <span class="counter-value" id="valReserved">458</span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="percentage-text" id="percentageText">0.045%</div>
        
        <button class="cta-btn" id="ctaBtn" onclick="bookPixelAlert()">احجز مكانك في الجدارية الآن 🚀</button>
    </div>

    <div class="grid-container">
        <div class="pixel-grid" id="pixelGrid"></div>
    </div>

    <footer>
        <span id="footerText">&copy; 2026 جدارية مليون سيلفي. جميع الحقوق محفوظة.</span>
    </footer>

    <script>
        // قواميس اللغات الجاهزة للعمل الفوري
        var translations = {
            ar: {
                title: "جدارية مليون سيلفي",
                subtitle: "احجز مربعك في أكبر لوحة رقمية للتاريخ",
                lblRemaining: "المربعات المتبقية",
                lblReserved: "المربعات المحجوزة",
                bookBtn: "احجز مكانك في الجدارية الآن 🚀",
                liveStatus: "اضغط على أي مربع في الشبكة بالأسفل لاختياره",
                alertMsg: "أهلاً بك! نقوم حالياً ببرمجة لوحة تحكم لتتيح لك رفع صورتك الخاصة واختيار موقعك وربطها ببوابة الدفع. انتظرنا قريباً جداً!",
                footer: "© 2026 جدارية مليون سيلفي. جميع الحقوق محفوظة.",
                langBtn: "English",
                selectedTxt: "قمت باختيار مربع متاح برقم: #",
                takenTxt: "هذا المربع محجوز ومثبت عليه صورة سيلفي بالفعل!"
            },
            en: {
                title: "Million Selfie Wall",
                subtitle: "Reserve your pixel in the biggest digital wall in history",
                lblRemaining: "Remaining Pixels",
                lblReserved: "Reserved Pixels",
                bookBtn: "Book Your Pixel Now 🚀",
                liveStatus: "Tap on any pixel in the grid below to view or select it",
                alertMsg: "Welcome! We are currently building the dashboard to let you upload your selfie, pick your exact coordinates, and complete payment. Launching very soon!",
                footer: "© 2026 Million Selfie Wall. All rights reserved.",
                langBtn: "العربية",
                selectedTxt: "You selected available pixel code: #",
                takenTxt: "This pixel is already reserved with a selfie!"
            }
        };

        var currentLang = 'ar';
        var selectedPixelIndex = -1;

        // بيانات المربعات - محاكاة
        const TOTAL_PIXELS = 25 * 25;
        const RESERVED_COUNT = 458;
        const RESERVED_INDICES = new Set();

        // توليد مؤشرات محجوزة عشوائية (باستثناء المربع الأول)
        while (RESERVED_INDICES.size < RESERVED_COUNT) {
            const idx = Math.floor(Math.random() * TOTAL_PIXELS);
            if (idx !== 0) { // نخلي المربع الأول متاح دائماً للتجربة
                RESERVED_INDICES.add(idx);
            }
        }

        // تعيين الفئات للمربعات المحجوزة
        function getPixelClass(index) {
            if (!RESERVED_INDICES.has(index)) return '';
            const rand = Math.random();
            if (rand < 0.33) return 'taken-vip';
            if (rand < 0.66) return 'taken-user';
            return 'taken-gold';
        }

        // إنشاء الشبكة
        function createGrid() {
            const grid = document.getElementById('pixelGrid');
            grid.innerHTML = '';
            for (let i = 0; i < TOTAL_PIXELS; i++) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel';
                pixel.dataset.index = i;
                
                const cls = getPixelClass(i);
                if (cls) pixel.classList.add(cls);
                
                pixel.addEventListener('click', function() {
                    handlePixelClick(parseInt(this.dataset.index));
                });
                
                grid.appendChild(pixel);
            }
            updateStats();
        }

        // معالجة النقر على المربع
        function handlePixelClick(index) {
            const pixels = document.querySelectorAll('.pixel');
            
            // إزالة التحديد السابق
            pixels.forEach(p => p.classList.remove('selected'));
            
            // التحقق إذا كان المربع محجوز
            if (RESERVED_INDICES.has(index)) {
                document.getElementById('liveStatus').textContent = 
                    translations[currentLang].takenTxt;
                return;
            }
            
            // تحديد المربع الجديد
            pixels[index].classList.add('selected');
            selectedPixelIndex = index;
            
            // تحديث النص
            const msg = translations[currentLang].selectedTxt + (index + 1);
            document.getElementById('liveStatus').textContent = msg;
        }

        // تحديث الإحصائيات
        function updateStats() {
            const remaining = TOTAL_PIXELS - RESERVED_COUNT;
            document.getElementById('valRemaining').textContent = remaining.toLocaleString();
            document.getElementById('valReserved').textContent = RESERVED_COUNT.toLocaleString();
            
            const percent = ((RESERVED_COUNT / TOTAL_PIXELS) * 100);
            document.getElementById('percentageText').textContent = percent.toFixed(3) + '%';
            document.getElementById('progressBar').style.width = percent + '%';
        }

        // زر الحجز
        function bookPixelAlert() {
            alert(translations[currentLang].alertMsg);
        }

        // تبديل اللغة
        function toggleLanguage() {
            const newLang = currentLang === 'ar' ? 'en' : 'ar';
            currentLang = newLang;
            
            // تحديث اتجاه الصفحة
            document.documentElement.dir = newLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = newLang;
            
            // تحديث النصوص
            document.getElementById('mainTitle').textContent = translations[newLang].title;
            document.getElementById('subTitle').textContent = translations[newLang].subtitle;
            document.getElementById('lblRemaining').textContent = translations[newLang].lblRemaining;
            document.getElementById('lblReserved').textContent = translations[newLang].lblReserved;
            document.getElementById('ctaBtn').textContent = translations[newLang].bookBtn;
            document.getElementById('footerText').textContent = translations[newLang].footer;
            document.getElementById('langBtn').textContent = translations[newLang].langBtn;
            
            // تحديث حالة المربع المحدد
            if (selectedPixelIndex !== -1 && !RESERVED_INDICES.has(selectedPixelIndex)) {
                document.getElementById('liveStatus').textContent = 
                    translations[newLang].selectedTxt + (selectedPixelIndex + 1);
            } else {
                document.getElementById('liveStatus').textContent = translations[newLang].liveStatus;
            }
        }

        // تحميل الشبكة عند بدء الصفحة
        window.onload = function() {
            createGrid();
            
            // تحديد مربع افتراضي (المربع الأول)
            setTimeout(() => {
                handlePixelClick(0);
            }, 100);
        };

        // جعل التابعين عالميين
        window.toggleLanguage = toggleLanguage;
        window.bookPixelAlert = bookPixelAlert;
    </script>
</body>
</html>
