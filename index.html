<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جدارية مليون سيلفي | Million Selfie Wall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f1f5f9;
            --accent-color: #f59e0b;
            --grid-line: #1e293b;
            --primary-font: 'Cairo', sans-serif;
        }

        html[dir="ltr"] {
            --primary-font: 'Poppins', sans-serif;
        }

        * {
            user-select: none;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--primary-font);
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top, #1e1b4b 0%, #0b0f19 70%);
            color: var(--text-color);
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== الشريط العلوي ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            padding: 4px 8px;
            margin-bottom: 2px;
        }

        .lang-switch-btn {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 6px 16px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }
        
        .lang-switch-btn:hover {
            background: var(--accent-color);
            color: #000;
        }

        .title-area {
            text-align: center;
            flex: 1;
        }

        .title-area h1 {
            color: var(--accent-color);
            font-size: 2rem;
            margin: 0;
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
            font-weight: 900;
            letter-spacing: 1px;
        }

        .title-area p {
            font-size: 0.95rem;
            opacity: 0.8;
            margin: 0;
            font-weight: 400;
        }

        .spacer {
            width: 60px;
        }

        /* ===== شريط الحالة ===== */
        .status-bar {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid var(--accent-color);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            margin-bottom: 6px;
            justify-content: center;
            min-height: 40px;
            font-weight: 700;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        #liveStatus {
            color: #10b981;
        }

        /* ===== أدوات التحكم ===== */
        .controls-bar {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }

        .controls-bar button {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--grid-line);
            color: white;
            padding: 4px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: var(--primary-font);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .controls-bar button:hover {
            background: var(--accent-color);
            color: #000;
        }

        .zoom-display {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 0.9rem;
            min-width: 50px;
            text-align: center;
        }

        /* ===== حاوية الشبكة (Canvas) - أكبر حجم ===== */
        .grid-wrapper {
            flex: 1;
            min-height: 45vh;
            max-height: 65vh;
            width: 100%;
            overflow: hidden;
            position: relative;
            background-color: #0b0f19;
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.08);
            margin-bottom: 6px;
            touch-action: none;
            cursor: grab;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        .grid-wrapper:active {
            cursor: grabbing;
        }

        #pixelCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background-color: #0b0f19;
            image-rendering: pixelated;
        }

        /* ===== شريط التنقل ===== */
        .nav-bar {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
            flex-shrink: 0;
            margin-bottom: 4px;
        }

        .nav-bar button {
            padding: 4px 12px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--grid-line);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 0.7rem;
            font-family: var(--primary-font);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .nav-bar button:hover {
            background: var(--accent-color);
            color: #000;
        }

        /* ===== منطقة الاختيار - في الأسفل ===== */
        .selection-area {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 12px 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
            margin-bottom: 4px;
        }

        .selection-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .selection-controls label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .selection-controls input {
            padding: 8px 14px;
            border-radius: 10px;
            border: 2px solid var(--grid-line);
            background: #0f172a;
            color: white;
            font-size: 1rem;
            width: 160px;
            font-family: var(--primary-font);
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
        }

        .selection-controls input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }

        .selection-controls button {
            padding: 8px 20px;
            border-radius: 10px;
            border: none;
            background: var(--accent-color);
            color: #000;
            font-weight: 700;
            cursor: pointer;
            font-family: var(--primary-font);
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .selection-controls button:hover {
            background: #d97706;
            transform: scale(1.05);
        }

        .selection-controls .random-btn {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
        }

        .selection-controls .random-btn:hover {
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
        }

        .info-text {
            font-size: 0.85rem;
            margin-top: 6px;
            text-align: center;
            font-weight: 600;
        }

        .info-text .available {
            color: #10b981;
        }

        .info-text .reserved {
            color: #ef4444;
        }

        .info-text .pixel-number {
            color: var(--accent-color);
            font-size: 1.1rem;
        }

        /* ===== التذييل ===== */
        footer {
            padding: 2px;
            font-size: 0.6rem;
            opacity: 0.4;
            text-align: center;
            flex-shrink: 0;
        }

        /* ===== تحسينات للجوال ===== */
        @media (max-width: 600px) {
            .title-area h1 { font-size: 1.4rem; }
            .title-area p { font-size: 0.7rem; }
            .status-bar { font-size: 0.75rem; padding: 6px 12px; min-height: 32px; }
            .selection-controls input { width: 120px; font-size: 0.85rem; padding: 6px 10px; }
            .selection-controls button { padding: 6px 14px; font-size: 0.75rem; }
            .controls-bar button { padding: 3px 10px; font-size: 0.65rem; }
            .nav-bar button { padding: 3px 8px; font-size: 0.6rem; }
            .grid-wrapper { min-height: 40vh; max-height: 55vh; }
            .lang-switch-btn { font-size: 0.65rem; padding: 4px 12px; }
            .spacer { width: 40px; }
            .info-text { font-size: 0.7rem; }
        }

        @media (max-width: 400px) {
            .title-area h1 { font-size: 1.1rem; }
            .selection-controls input { width: 90px; font-size: 0.75rem; }
            .selection-controls button { padding: 4px 10px; font-size: 0.65rem; }
            .status-bar { font-size: 0.6rem; padding: 4px 8px; min-height: 28px; }
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-bar">
        <button class="lang-switch-btn" id="langBtn" onclick="toggleLanguage()">English</button>
        <div class="title-area">
            <h1 id="mainTitle">جدارية مليون سيلفي</h1>
            <p id="subTitle">احجز مربعك في أكبر لوحة رقمية للتاريخ</p>
        </div>
        <div class="spacer"></div>
    </div>

    <!-- شريط الحالة -->
    <div class="status-bar">
        <span class="live-dot"></span>
        <span id="liveStatus">اضغط على مربع لاختياره</span>
    </div>

    <!-- أدوات التحكم -->
    <div class="controls-bar">
        <button onclick="resetView()" id="resetBtn">🔄 إعادة تعيين</button>
        <button onclick="zoomIn()" id="zoomInBtn">➕ تكبير</button>
        <span class="zoom-display" id="zoomDisplay">100%</span>
        <button onclick="zoomOut()" id="zoomOutBtn">➖ تصغير</button>
        <button onclick="fitToScreen()" id="fitBtn">📐 ملاءمة</button>
    </div>

    <!-- حاوية الشبكة (Canvas) -->
    <div class="grid-wrapper" id="gridWrapper">
        <canvas id="pixelCanvas"></canvas>
    </div>

    <!-- شريط التنقل -->
    <div class="nav-bar">
        <button onclick="goToPixel(1)">⬅️ البداية</button>
        <button onclick="goToPixel(250000)">الربع الأول</button>
        <button onclick="goToPixel(500000)">المنتصف</button>
        <button onclick="goToPixel(750000)">الربع الأخير</button>
        <button onclick="goToPixel(1000000)">النهاية ➡️</button>
    </div>

    <!-- منطقة الاختيار - في الأسفل -->
    <div class="selection-area">
        <div class="selection-controls">
            <label>🔢 رقم المربع:</label>
            <input type="number" id="pixelNumberInput" min="1" max="1000000" placeholder="مثال: 48429">
            <button onclick="selectPixelByNumber()" id="selectBtn">اختر</button>
            <button onclick="selectRandomPixel()" class="random-btn" id="randomBtn">🎲 عشوائي</button>
        </div>
        <div id="selectedPixelInfo" class="info-text">✨ اختر مربعاً من الشبكة أو أدخل رقمه</div>
    </div>

    <footer>
        <span id="footerText">© 2026 جدارية مليون سيلفي - جميع الحقوق محفوظة</span>
    </footer>

    <script>
        // ============================================
        // البيانات
        // ============================================
        const TOTAL_PIXELS = 1000000;
        const COLS = 1000;
        const ROWS = 1000;

        // توليد بيانات المحجوزات
        const RESERVED_COUNT = 458;
        const RESERVED_INDICES = new Set();
        
        while (RESERVED_INDICES.size < RESERVED_COUNT) {
            const idx = Math.floor(Math.random() * TOTAL_PIXELS);
            RESERVED_INDICES.add(idx);
        }

        const pixelStatus = new Array(TOTAL_PIXELS).fill(false);
        RESERVED_INDICES.forEach(idx => pixelStatus[idx] = true);

        // ألوان المربعات المحجوزة
        const RESERVED_COLORS = {};
        RESERVED_INDICES.forEach(idx => {
            const rand = Math.random();
            if (rand < 0.33) RESERVED_COLORS[idx] = '#eab308';
            else if (rand < 0.66) RESERVED_COLORS[idx] = '#f59e0b';
            else RESERVED_COLORS[idx] = '#94a3b8';
        });

        // ============================================
        // متغيرات التحكم
        // ============================================
        let scale = 1;
        let panX = 0;
        let panY = 0;
        const MIN_SCALE = 0.02;
        const MAX_SCALE = 10;
        
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let startPanX = 0;
        let startPanY = 0;

        let canvas, ctx;
        let canvasWidth, canvasHeight;
        let selectedPixelIndex = -1;

        // ============================================
        // متغيرات اللغة
        // ============================================
        var currentLang = 'ar';

        var translations = {
            ar: {
                title: "جدارية مليون سيلفي",
                subtitle: "احجز مربعك في أكبر لوحة رقمية للتاريخ",
                liveStatus: "اضغط على مربع لاختياره",
                alertMsg: "أهلاً بك! نقوم حالياً ببرمجة لوحة تحكم لتتيح لك رفع صورتك الخاصة واختيار موقعك وربطها ببوابة الدفع. انتظرنا قريباً جداً!",
                footer: "© 2026 جدارية مليون سيلفي - جميع الحقوق محفوظة",
                langBtn: "English",
                selectedTxt: "✅ تم اختيار المربع رقم ",
                takenTxt: "❌ هذا المربع محجوز بالفعل!",
                selectBtn: "اختر",
                randomBtn: "🎲 عشوائي",
                noSelection: "✨ اختر مربعاً من الشبكة أو أدخل رقمه",
                available: "✅ متاح",
                reserved: "❌ محجوز",
                resetBtn: "🔄 إعادة تعيين",
                zoomInBtn: "➕ تكبير",
                zoomOutBtn: "➖ تصغير",
                fitBtn: "📐 ملاءمة"
            },
            en: {
                title: "Million Selfie Wall",
                subtitle: "Reserve your pixel in the biggest digital wall in history",
                liveStatus: "Tap on any pixel to select it",
                alertMsg: "Welcome! We are currently building the dashboard to let you upload your selfie, pick your exact coordinates, and complete payment. Launching very soon!",
                footer: "© 2026 Million Selfie Wall - All Rights Reserved",
                langBtn: "العربية",
                selectedTxt: "✅ Selected pixel #",
                takenTxt: "❌ This pixel is already reserved!",
                selectBtn: "Select",
                randomBtn: "🎲 Random",
                noSelection: "✨ Select a pixel from the grid or enter its number",
                available: "✅ Available",
                reserved: "❌ Reserved",
                resetBtn: "🔄 Reset",
                zoomInBtn: "➕ Zoom In",
                zoomOutBtn: "➖ Zoom Out",
                fitBtn: "📐 Fit"
            }
        };

        // ============================================
        // تهيئة Canvas
        // ============================================
        function initCanvas() {
            canvas = document.getElementById('pixelCanvas');
            ctx = canvas.getContext('2d');
            
            const wrapper = document.getElementById('gridWrapper');
            canvasWidth = wrapper.clientWidth;
            canvasHeight = wrapper.clientHeight;
            
            canvas.width = canvasWidth * window.devicePixelRatio;
            canvas.height = canvasHeight * window.devicePixelRatio;
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';
            
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            drawGrid();
        }

        // ============================================
        // رسم الشبكة
        // ============================================
        function drawGrid() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            
            const pixelSize = Math.max(1, Math.min(12, (canvasWidth / COLS) * scale));
            const totalWidth = COLS * pixelSize;
            const totalHeight = ROWS * pixelSize;
            
            const offsetX = panX + (canvasWidth - totalWidth) / 2;
            const offsetY = panY + (canvasHeight - totalHeight) / 2;
            
            const startCol = Math.max(0, Math.floor(-offsetX / pixelSize));
            const endCol = Math.min(COLS, Math.ceil((canvasWidth - offsetX) / pixelSize) + 1);
            const startRow = Math.max(0, Math.floor(-offsetY / pixelSize));
            const endRow = Math.min(ROWS, Math.ceil((canvasHeight - offsetY) / pixelSize) + 1);
            
            // رسم الخلفية
            ctx.fillStyle = '#0b0f19';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            
            for (let row = startRow; row < endRow; row++) {
                for (let col = startCol; col < endCol; col++) {
                    const index = row * COLS + col;
                    if (index >= TOTAL_PIXELS) continue;
                    
                    const x = offsetX + col * pixelSize;
                    const y = offsetY + row * pixelSize;
                    
                    let color = '#131c2e';
                    if (RESERVED_INDICES.has(index)) {
                        color = RESERVED_COLORS[index] || '#ec4899';
                    }
                    
                    const isSelected = (index === selectedPixelIndex && !RESERVED_INDICES.has(index));
                    
                    if (isSelected) {
                        // إضاءة قوية للمربع المختار
                        const gradient = ctx.createRadialGradient(
                            x + pixelSize/2, y + pixelSize/2, 0,
                            x + pixelSize/2, y + pixelSize/2, pixelSize * 3
                        );
                        gradient.addColorStop(0, 'rgba(16, 185, 129, 0.9)');
                        gradient.addColorStop(0.3, 'rgba(16, 185, 129, 0.5)');
                        gradient.addColorStop(1, 'rgba(16, 185, 129, 0)');
                        
                        ctx.fillStyle = gradient;
                        ctx.fillRect(x - pixelSize, y - pixelSize, pixelSize * 3, pixelSize * 3);
                        
                        // المربع نفسه باللون الأخضر المضيء
                        ctx.shadowColor = 'rgba(16, 185, 129, 0.9)';
                        ctx.shadowBlur = 30;
                        ctx.fillStyle = '#10b981';
                        ctx.fillRect(x, y, pixelSize, pixelSize);
                        ctx.shadowBlur = 0;
                        
                        // حدود بيضاء حول المربع المختار
                        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                        ctx.lineWidth = Math.max(1, pixelSize * 0.2);
                        ctx.strokeRect(x, y, pixelSize, pixelSize);
                    } else {
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = color;
                        ctx.fillRect(x, y, pixelSize, pixelSize);
                    }
                    
                    // حدود بين المربعات
                    if (pixelSize > 3 && !isSelected) {
                        ctx.strokeStyle = 'rgba(30, 41, 59, 0.2)';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(x, y, pixelSize, pixelSize);
                    }
                }
            }
            
            // إعادة تعيين الظل
            ctx.shadowBlur = 0;
        }

        // ============================================
        // تحويل الإحداثيات
        // ============================================
        function getPixelIndexFromScreen(screenX, screenY) {
            const rect = canvas.getBoundingClientRect();
            const x = screenX - rect.left;
            const y = screenY - rect.top;
            
            const pixelSize = Math.max(1, Math.min(12, (canvasWidth / COLS) * scale));
            const totalWidth = COLS * pixelSize;
            const totalHeight = ROWS * pixelSize;
            
            const offsetX = panX + (canvasWidth - totalWidth) / 2;
            const offsetY = panY + (canvasHeight - totalHeight) / 2;
            
            const col = Math.floor((x - offsetX) / pixelSize);
            const row = Math.floor((y - offsetY) / pixelSize);
            
            if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
                return row * COLS + col;
            }
            return -1;
        }

        // ============================================
        // معالجة النقر
        // ============================================
        function handleCanvasClick(e) {
            const index = getPixelIndexFromScreen(e.clientX, e.clientY);
            if (index === -1) return;
            
            if (pixelStatus[index]) {
                document.getElementById('liveStatus').textContent = 
                    translations[currentLang].takenTxt;
                document.getElementById('selectedPixelInfo').innerHTML = 
                    `❌ المربع #<span class="pixel-number">${index + 1}</span> - <strong class="reserved">${translations[currentLang].reserved}</strong>`;
                selectedPixelIndex = -1;
                drawGrid();
                return;
            }
            
            selectedPixelIndex = index;
            document.getElementById('liveStatus').textContent = 
                translations[currentLang].selectedTxt + (index + 1);
            document.getElementById('selectedPixelInfo').innerHTML = 
                `📍 المربع #<span class="pixel-number">${index + 1}</span> - <strong class="available">${translations[currentLang].available}</strong>`;
            document.getElementById('pixelNumberInput').value = index + 1;
            
            centerOnPixel(index);
            drawGrid();
        }

        // ============================================
        // التحكم في التكبير والتحريك
        // ============================================
        function updateTransform() {
            document.getElementById('zoomDisplay').textContent = Math.round(scale * 100) + '%';
            drawGrid();
        }

        function zoomIn() {
            const newScale = Math.min(scale * 1.4, MAX_SCALE);
            const centerX = canvasWidth / 2;
            const centerY = canvasHeight / 2;
            panX = centerX - (centerX - panX) * (newScale / scale);
            panY = centerY - (centerY - panY) * (newScale / scale);
            scale = newScale;
            updateTransform();
        }

        function zoomOut() {
            const newScale = Math.max(scale / 1.4, MIN_SCALE);
            const centerX = canvasWidth / 2;
            const centerY = canvasHeight / 2;
            panX = centerX - (centerX - panX) * (newScale / scale);
            panY = centerY - (centerY - panY) * (newScale / scale);
            scale = newScale;
            updateTransform();
        }

        function resetView() {
            scale = 1;
            panX = 0;
            panY = 0;
            updateTransform();
        }

        function fitToScreen() {
            const wrapper = document.getElementById('gridWrapper');
            const w = wrapper.clientWidth;
            const h = wrapper.clientHeight;
            
            const scaleX = w / COLS;
            const scaleY = h / ROWS;
            scale = Math.min(scaleX, scaleY, 1);
            
            panX = 0;
            panY = 0;
            updateTransform();
        }

        function centerOnPixel(index) {
            const pixelSize = Math.max(1, Math.min(12, (canvasWidth / COLS) * scale));
            const totalWidth = COLS * pixelSize;
            const totalHeight = ROWS * pixelSize;
            
            const col = index % COLS;
            const row = Math.floor(index / COLS);
            
            const offsetX = panX + (canvasWidth - totalWidth) / 2;
            const offsetY = panY + (canvasHeight - totalHeight) / 2;
            
            const targetX = -offsetX + canvasWidth / 2 - col * pixelSize - pixelSize / 2;
            const targetY = -offsetY + canvasHeight / 2 - row * pixelSize - pixelSize / 2;
            
            panX = targetX;
            panY = targetY;
            updateTransform();
        }

        // ============================================
        // أحداث السحب
        // ============================================
        function setupPanning() {
            const wrapper = document.getElementById('gridWrapper');
            
            wrapper.addEventListener('mousedown', startDrag);
            window.addEventListener('mousemove', drag);
            window.addEventListener('mouseup', endDrag);
            
            wrapper.addEventListener('touchstart', handleTouchStart, { passive: false });
            window.addEventListener('touchmove', handleTouchMove, { passive: false });
            window.addEventListener('touchend', handleTouchEnd, { passive: false });
            
            wrapper.addEventListener('wheel', handleWheel, { passive: false });
            
            canvas.addEventListener('click', handleCanvasClick);
        }

        function startDrag(e) {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startPanX = panX;
            startPanY = panY;
            document.getElementById('gridWrapper').style.cursor = 'grabbing';
        }

        function drag(e) {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            panX = startPanX + dx;
            panY = startPanY + dy;
            drawGrid();
        }

        function endDrag() {
            isDragging = false;
            document.getElementById('gridWrapper').style.cursor = 'grab';
        }

        let touchStartX = 0, touchStartY = 0;
        let touchStartPanX = 0, touchStartPanY = 0;
        let lastTouchDist = 0;

        function handleTouchStart(e) {
            e.preventDefault();
            const touches = e.touches;
            if (touches.length === 1) {
                isDragging = true;
                touchStartX = touches[0].clientX;
                touchStartY = touches[0].clientY;
                touchStartPanX = panX;
                touchStartPanY = panY;
            } else if (touches.length === 2) {
                lastTouchDist = getTouchDistance(touches);
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            const touches = e.touches;
            
            if (touches.length === 1 && isDragging) {
                const dx = touches[0].clientX - touchStartX;
                const dy = touches[0].clientY - touchStartY;
                panX = touchStartPanX + dx;
                panY = touchStartPanY + dy;
                drawGrid();
            } else if (touches.length === 2) {
                const dist = getTouchDistance(touches);
                const delta = dist - lastTouchDist;
                const newScale = Math.min(Math.max(scale * (1 + delta / 400), MIN_SCALE), MAX_SCALE);
                const centerX = canvasWidth / 2;
                const centerY = canvasHeight / 2;
                panX = centerX - (centerX - panX) * (newScale / scale);
                panY = centerY - (centerY - panY) * (newScale / scale);
                scale = newScale;
                lastTouchDist = dist;
                drawGrid();
            }
        }

        function handleTouchEnd(e) {
            isDragging = false;
        }

        function getTouchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function handleWheel(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const newScale = Math.min(Math.max(scale * delta, MIN_SCALE), MAX_SCALE);
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;
            
            drawGrid();
        }

        // ============================================
        // اختيار المربعات
        // ============================================
        function selectPixelByNumber() {
            const input = document.getElementById('pixelNumberInput');
            const num = parseInt(input.value);
            
            if (isNaN(num) || num < 1 || num > TOTAL_PIXELS) {
                alert(`الرجاء إدخال رقم بين 1 و ${TOTAL_PIXELS.toLocaleString()}`);
                return;
            }
            
            const index = num - 1;
            
            if (pixelStatus[index]) {
                document.getElementById('liveStatus').textContent = 
                    translations[currentLang].takenTxt;
                document.getElementById('selectedPixelInfo').innerHTML = 
                    `❌ المربع #<span class="pixel-number">${num}</span> - <strong class="reserved">${translations[currentLang].reserved}</strong>`;
                selectedPixelIndex = -1;
                drawGrid();
                return;
            }
            
            selectedPixelIndex = index;
            document.getElementById('liveStatus').textContent = 
                translations[currentLang].selectedTxt + (index + 1);
            document.getElementById('selectedPixelInfo').innerHTML = 
                `📍 المربع #<span class="pixel-number">${index + 1}</span> - <strong class="available">${translations[currentLang].available}</strong>`;
            
            centerOnPixel(index);
            drawGrid();
        }

        function selectRandomPixel() {
            let attempts = 0;
            let index;
            
            do {
                index = Math.floor(Math.random() * TOTAL_PIXELS);
                attempts++;
            } while (pixelStatus[index] && attempts < 100);
            
            if (pixelStatus[index]) {
                alert('جميع المربعات العشوائية محجوزة! حاول مرة أخرى.');
                return;
            }
            
            selectedPixelIndex = index;
            document.getElementById('liveStatus').textContent = 
                translations[currentLang].selectedTxt + (index + 1);
            document.getElementById('selectedPixelInfo').innerHTML = 
                `📍 المربع #<span class="pixel-number">${index + 1}</span> - <strong class="available">${translations[currentLang].available}</strong>`;
            document.getElementById('pixelNumberInput').value = index + 1;
            
            centerOnPixel(index);
            drawGrid();
        }

        function goToPixel(num) {
            const index = num - 1;
            if (index < 0 || index >= TOTAL_PIXELS) return;
            
            if (pixelStatus[index]) {
                document.getElementById('pixelNumberInput').value = num;
                document.getElementById('liveStatus').textContent = 
                    translations[currentLang].takenTxt;
                document.getElementById('selectedPixelInfo').innerHTML = 
                    `❌ المربع #<span class="pixel-number">${num}</span> - <strong class="reserved">${translations[currentLang].reserved}</strong>`;
                selectedPixelIndex = -1;
                drawGrid();
                return;
            }
            
            selectedPixelIndex = index;
            document.getElementById('liveStatus').textContent = 
                translations[currentLang].selectedTxt + (index + 1);
            document.getElementById('selectedPixelInfo').innerHTML = 
                `📍 المربع #<span class="pixel-number">${index + 1}</span> - <strong class="available">${translations[currentLang].available}</strong>`;
            document.getElementById('pixelNumberInput').value = index + 1;
            
            centerOnPixel(index);
            drawGrid();
        }

        // ============================================
        // تبديل اللغة
        // ============================================
        function toggleLanguage() {
            const newLang = currentLang === 'ar' ? 'en' : 'ar';
            currentLang = newLang;
            
            document.documentElement.dir = newLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = newLang;
            
            document.getElementById('mainTitle').textContent = translations[newLang].title;
            document.getElementById('subTitle').textContent = translations[newLang].subtitle;
            document.getElementById('footerText').textContent = translations[newLang].footer;
            document.getElementById('langBtn').textContent = translations[newLang].langBtn;
            document.getElementById('selectBtn').textContent = translations[newLang].selectBtn;
            document.getElementById('randomBtn').textContent = translations[newLang].randomBtn;
            document.getElementById('resetBtn').textContent = translations[newLang].resetBtn;
            document.getElementById('zoomInBtn').textContent = translations[newLang].zoomInBtn;
            document.getElementById('zoomOutBtn').textContent = translations[newLang].zoomOutBtn;
            document.getElementById('fitBtn').textContent = translations[newLang].fitBtn;
            
            if (selectedPixelIndex !== -1 && !pixelStatus[selectedPixelIndex]) {
                document.getElementById('liveStatus').textContent = 
                    translations[newLang].selectedTxt + (selectedPixelIndex + 1);
                document.getElementById('selectedPixelInfo').innerHTML = 
                    `📍 المربع #<span class="pixel-number">${selectedPixelIndex + 1}</span> - <strong class="available">${translations[newLang].available}</strong>`;
            } else {
                document.getElementById('liveStatus').textContent = translations[newLang].liveStatus;
                document.getElementById('selectedPixelInfo').textContent = translations[newLang].noSelection;
            }
        }

        // ============================================
        // تحميل الصفحة
        // ============================================
        window.onload = function() {
            initCanvas();
            setupPanning();
            fitToScreen();
            
            window.addEventListener('resize', () => {
                initCanvas();
                fitToScreen();
            });
            
            // اختيار مربع افتراضي
            setTimeout(() => {
                for (let i = 0; i < TOTAL_PIXELS; i++) {
                    if (!pixelStatus[i]) {
                        selectedPixelIndex = i;
                        document.getElementById('pixelNumberInput').value = i + 1;
                        document.getElementById('liveStatus').textContent = 
                            translations[currentLang].selectedTxt + (i + 1);
                        document.getElementById('selectedPixelInfo').innerHTML = 
                            `📍 المربع #<span class="pixel-number">${i + 1}</span> - <strong class="available">${translations[currentLang].available}</strong>`;
                        centerOnPixel(i);
                        drawGrid();
                        break;
                    }
                }
            }, 300);
        };

        // جعل التوابع عالمية
        window.toggleLanguage = toggleLanguage;
        window.selectPixelByNumber = selectPixelByNumber;
        window.selectRandomPixel = selectRandomPixel;
        window.goToPixel = goToPixel;
        window.zoomIn = zoomIn;
        window.zoomOut = zoomOut;
        window.resetView = resetView;
        window.fitToScreen = fitToScreen;
    </script>
</body>
</html>
