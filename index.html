<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدارية مليون سيلفي | Million Selfie Wall</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #f59e0b;
            --grid-line: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        /* زر تبديل اللغة */
        .lang-switch-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        html[dir="ltr"] .lang-switch-btn {
            left: auto;
            right: 20px;
        }

        /* الهيدر والعناوين */
        header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 20px;
            max-width: 600px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* لوحة التحكم والعدادات */
        .dashboard {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            text-align: center;
            box-sizing: border-box;
        }

        .counter-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .counter-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .counter-label {
            font-size: 1.1rem;
        }

        /* شريط التقدم */
        .progress-container {
            background-color: #0f172a;
            border-radius: 10px;
            height: 20px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 10px;
            border: 1px solid var(--grid-line);
        }

        .progress-bar {
            background: linear-gradient(90deg, #f59e0b, #ef4444);
            width: 0.01%; /* ستتغير برمجياً */
            height: 100%;
            transition: width 1s ease-in-out;
        }

        .percentage-text {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.2rem;
        }

        /* زر الحجز الرئيسي */
        .cta-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            transition: transform 0.2s;
        }

        .cta-btn:hover {
            transform: scale(1.02);
            background-color: #059669;
        }

        /* جدارية الشبكة للمربعات */
        .grid-container {
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            margin-bottom: 40px;
        }

        .pixel-grid {
            display: grid;
            grid-template-columns: repeat(20, 15px);
            grid-template-rows: repeat(20, 15px);
            gap: 2px;
            background-color: #0f172a;
            padding: 5px;
            border: 2px solid var(--grid-line);
        }

        .pixel {
            background-color: #1e293b;
            border: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
            transition: all 0.2s;
        }

        .pixel:hover {
            background-color: var(--accent-color);
            transform: scale(1.2);
            z-index: 10;
        }

        /* نموذج لمربعات محجوزة مسبقاً للعرض */
        .pixel.taken {
            background-color: #ef4444;
        }
    </style>
</head>
<body>

    <!-- زر التبديل للغات -->
    <button class="lang-switch-btn" id="langBtn" onclick="toggleLanguage()">English</button>

    <header>
        <h1 id="mainTitle">جدارية مليون سيلفي</h1>
        <p class="subtitle" id="subTitle">احجز مربعك في أكبر لوحة رقمية للتاريخ</p>
    </header>

    <div class="dashboard">
        <div class="counter-box">
            <span class="counter-label" id="counterLabel">المربعات المتبقية:</span>
            <span class="counter-value" id="counterValue">999,952</span>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="percentage-text" id="percentText">0.005%</div>
        
        <button class="cta-btn" id="ctaBtn" onclick="bookPixelAlert()">احجز مربعك الآن 🚀</button>
    </div>

    <!-- شبكة المربعات التفاعلية المعروضة -->
    <div class="grid-container">
        <div class="pixel-grid" id="pixelGrid"></div>
    </div>

    <script>
        // نصوص اللغتين
        const translations = {
            ar: {
                title: "جدارية مليون سيلفي",
                subtitle: "احجز مربعك في أكبر لوحة رقمية للتاريخ",
                remaining: "المربعات المتبقية:",
                bookBtn: "احجز مربعك الآن 🚀",
                alertMsg: "سيتم فتح باب الحجز المباشر وتحديث اللوحة وربطها بنظام الدفع قريباً جداً!",
                langBtn: "English"
            },
            en: {
                title: "Million Selfie Wall",
                subtitle: "Reserve your pixel in the biggest digital wall in history",
                remaining: "Remaining Pixels:",
                bookBtn: "Book Your Pixel Now 🚀",
                alertMsg: "Live bookings, wall updates, and payment integration are coming very soon!",
                langBtn: "العربية"
            }
        };

        let currentLang = 'ar';

        // دالة تبديل اللغة وإعادة توجيه العناصر والاتجاهات
        function toggleLanguage() {
            if (currentLang === 'ar') {
                currentLang = 'en';
                document.documentElement.lang = 'en';
                document.documentElement.dir = 'ltr';
            } else {
                currentLang = 'ar';
                document.documentElement.lang = 'ar';
                document.documentElement.dir = 'rtl';
            }

            // تحديث النصوص بناءً على اللغة المختارة
            document.getElementById('mainTitle').innerText = translations[currentLang].title;
            document.getElementById('subTitle').innerText = translations[currentLang].subtitle;
            document.getElementById('counterLabel').innerText = translations[currentLang].remaining;
            document.getElementById('ctaBtn').innerText = translations[currentLang].bookBtn;
            document.getElementById('langBtn').innerText = translations[currentLang].langBtn;
        }

        // تفاعلية تنشيط شريط التقدم البرمجي عند تحميل الموقع
        window.onload = function() {
            setTimeout(() => {
                // تفعيل حركة شريط التحميل تلقائياً بنسبة واقعية بسيطة للتجربة
                document.getElementById('progressBar').style.width = '2.5%'; 
                document.getElementById('percentText').innerText = '0.005%';
            }, 500);

            // توليد شبكة المربعات تفاعلياً تلقائياً
            const grid = document.getElementById('pixelGrid');
            for (let i = 0; i < 400; i++) {
                const pixel = document.createElement('div');
                pixel.classList.add('pixel');
                
                // إضافة مربعات عشوائية محجوزة باللون الأحمر لتعطي طابع الحجز الحقيقي للموقع
                if (Math.random() < 0.08) {
                    pixel.classList.add('taken');
                    pixel.title = currentLang === 'ar' ? "مربع محجوز" : "Reserved Pixel";
                } else {
                    pixel.title = currentLang === 'ar' ? `مربع متاح #${i+1}` : `Available Pixel #${i+1}`;
                }

                // حدث الضغط على المربع الفردي في الشبكة
                pixel.addEventListener('click', () => {
                    if(pixel.classList.contains('taken')) {
                        alert(currentLang === 'ar' ? "هذا المربع محجوز بالفعل!" : "This pixel is already reserved!");
                    } else {
                        alert(currentLang === 'ar' ? `لقد قمت باختيار المربع رقم # ${i+1} للقرع واحجز المربع بالكامل عند الإطلاق.` : `You selected pixel #${i+1}.`);
                    }
                });

                grid.appendChild(pixel);
            }
        };

        // رسالة عند الضغط على زر احجز الآن الرئيسي
        function bookPixelAlert() {
            alert(translations[currentLang].alertMsg);
        }
    </script>
</body>
</html>
