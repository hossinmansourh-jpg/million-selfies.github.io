<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
  body { background: #0a0a0f; color: #fff; min-height: 100vh; padding: 15px; }
  .container { max-width: 900px; margin: 0 auto; }

  .login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; padding: 20px; }
  .login-card { background: #14141c; border: 2px solid #d4a017; border-radius: 16px; padding: 30px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 0 30px rgba(212,160,23,0.2); }
  .login-card h1 { color: #f5b301; font-size: 24px; margin-bottom: 10px; }
  .login-card p { color: #a0a0a0; font-size: 14px; margin-bottom: 20px; }
  .login-card input { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid #2a2a35; background: #0e0e14; color: #fff; font-family: 'Cairo'; font-size: 14px; margin-bottom: 10px; }
  .login-card input:focus { outline: none; border-color: #d4a017; }
  .btn-login { width: 100%; padding: 14px; border-radius: 10px; border: none; background: linear-gradient(135deg, #d4a017, #f5b301); color: #000; font-family: 'Cairo'; font-weight: 900; font-size: 16px; cursor: pointer; }
  .btn-login:hover { opacity: 0.9; }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
  .pwd-wrap { position: relative; }
  .pwd-wrap input { padding-left: 45px; }
  .pwd-toggle { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px; user-select: none; background: transparent; border: none; color: #f5b301; padding: 0; }
  .error-msg { color: #ff7f7f; font-size: 13px; margin-top: 10px; display: none; background: #3a1e1e; padding: 10px; border-radius: 8px; border: 1px solid #5a3a3a; }
  .error-msg.show { display: block; }

  .dashboard { display: none; }
  .dashboard.show { display: block; }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
  .header h1 { color: #f5b301; font-size: 22px; font-weight: 900; }
  .header .actions { display: flex; gap: 8px; }
  .header button { padding: 8px 14px; border-radius: 8px; border: 1.5px solid #2a2a35; background: #14141c; color: #f5b301; font-family: 'Cairo'; font-weight: 700; font-size: 13px; cursor: pointer; }
  .header button:hover { border-color: #d4a017; background: #1a1a24; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .stat { background: #14141c; border: 1.5px solid #2a2a35; border-top: 3px solid #d4a017; border-radius: 10px; padding: 15px; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 900; color: #f5b301; }
  .stat-lbl { font-size: 11px; color: #a0a0a0; margin-top: 4px; font-weight: 600; }

  .tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
  .tabs button { padding: 10px 16px; border-radius: 25px; border: 1.5px solid #2a2a35; background: #0e0e14; color: #a0a0a0; font-family: 'Cairo'; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .tabs button.active { background: linear-gradient(135deg, #d4a017, #f5b301); color: #000; border-color: #d4a017; }

  .search-bar { margin-bottom: 15px; }
  .search-bar input { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1.5px solid #2a2a35; background: #14141c; color: #fff; font-family: 'Cairo'; font-size: 14px; }
  .search-bar input:focus { outline: none; border-color: #d4a017; }

  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card { background: #14141c; border: 1.5px solid #2a2a35; border-radius: 12px; padding: 15px; transition: 0.2s; }
  .card:hover { border-color: #d4a017; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .card-id { color: #f5b301; font-weight: 900; font-size: 15px; }
  .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 900; }
  .status-pending { background: rgba(245,179,1,0.2); color: #f5b301; border: 1px solid #d4a017; }
  .status-approved { background: rgba(127,255,127,0.15); color: #7fff7f; border: 1px solid #3a5a3a; }
  .status-rejected { background: rgba(255,127,127,0.15); color: #ff7f7f; border: 1px solid #5a3a3a; }

  .card-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .info-item { font-size: 13px; }
  .info-item .label { color: #888; font-size: 11px; display: block; margin-bottom: 2px; }
  .info-item .value { color: #fff; font-weight: 700; }

  .card-images { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .card-image { flex: 1; min-width: 130px; }
  .card-image .label { color: #888; font-size: 11px; margin-bottom: 5px; display: block; }
  .card-image img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; border: 1.5px solid #2a2a35; cursor: pointer; transition: 0.2s; }
  .card-image img:hover { border-color: #d4a017; }

  .card-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .card-actions button { flex: 1; min-width: 100px; padding: 10px; border-radius: 8px; border: none; font-family: 'Cairo'; font-weight: 900; font-size: 13px; cursor: pointer; transition: 0.2s; }
  .btn-approve { background: linear-gradient(135deg, #2a7a2a, #3a9a3a); color: #fff; }
  .btn-approve:hover { opacity: 0.9; }
  .btn-reject { background: linear-gradient(135deg, #7a2a2a, #9a3a3a); color: #fff; }
  .btn-reject:hover { opacity: 0.9; }
  .btn-delete { background: #2a2a35; color: #ff7f7f; border: 1px solid #5a3a3a !important; }
  .btn-delete:hover { background: #3a1e1e; }

  .loading-text { text-align: center; color: #f5b301; padding: 40px 20px; font-weight: 700; font-size: 14px; }
  .empty-text { text-align: center; color: #666; padding: 40px 20px; font-size: 14px; }

  .image-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 9999; cursor: zoom-out; }
  .image-modal.show { display: flex; }
  .image-modal img { max-width: 100%; max-height: 90vh; border-radius: 10px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #14141c; border: 2px solid #d4a017; color: #fff; padding: 12px 20px; border-radius: 30px; font-family: 'Cairo'; font-weight: 700; font-size: 13px; z-index: 10000; display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
  .toast.show { display: block; animation: fadeIn 0.3s; }
  .toast.ok { border-color: #3a9a3a; color: #7fff7f; }
  .toast.err { border-color: #9a3a3a; color: #ff7f7f; }
  @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body>

<!-- ===== شاشة تسجيل الدخول ===== -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>🔒 لوحة التحكم</h1>
    <p>أدخل كلمة المرور للدخول</p>
    <input type="hidden" id="emailInput" value="hossinmansourh@gmail.com">
    <div class="pwd-wrap">
      <input type="password" id="pwdInput" placeholder="🔑 كلمة المرور">
      <button type="button" class="pwd-toggle" id="togglePwd">👁️</button>
    </div>
    <button class="btn-login" id="loginBtn">دخول</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<!-- ===== لوحة التحكم ===== -->
<div class="dashboard" id="dashboard">
  <div class="container">
    <div class="header">
      <h1>🎛️ لوحة التحكم</h1>
      <div class="actions">
        <button id="refreshBtn">🔄 تحديث</button>
        <button id="logoutBtn">🚪 خروج</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">إجمالي الطلبات</div></div>
      <div class="stat"><div class="stat-num" id="statPending">0</div><div class="stat-lbl">قيد الانتظار</div></div>
      <div class="stat"><div class="stat-num" id="statApproved">0</div><div class="stat-lbl">مقبولة</div></div>
      <div class="stat"><div class="stat-num" id="statRejected">0</div><div class="stat-lbl">مرفوضة</div></div>
      <div class="stat"><div class="stat-num" id="statRevenue">$0</div><div class="stat-lbl">إجمالي المبالغ</div></div>
    </div>

    <div class="tabs">
      <button class="active" data-status="pending">⏳ قيد الانتظار</button>
      <button data-status="approved">✅ مقبولة</button>
      <button data-status="rejected">❌ مرفوضة</button>
      <button data-status="all">📋 الكل</button>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="🔍 بحث بالاسم أو الرقم...">
    </div>

    <div class="cards" id="cardsContainer">
      <div class="loading-text">⏳ جارٍ التحميل...</div>
    </div>
  </div>
</div>

<div class="image-modal" id="imageModal">
  <img src="" alt="" id="modalImg">
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEMxWCT0siwT2t72CX24N1ajSAwqEk7Fs",
  authDomain: "million-selfies.firebaseapp.com",
  projectId: "million-selfies",
  storageBucket: "million-selfies.firebasestorage.app",
  messagingSenderId: "1016907817387",
  appId: "1:1016907817387:web:f6e9b2b76dcaecebe4b2ee"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const BOOKINGS_COLLECTION = "bookings";
const ADMIN_EMAIL = "hossinmansourh@gmail.com";

let allBookings = [];
let currentTab = "pending";
let currentSearch = "";

const loginScreen = document.getElementById('loginScreen');
const dashboard = document.getElementById('dashboard');
const pwdInput = document.getElementById('pwdInput');
const errorMsg = document.getElementById('errorMsg');
const loginBtn = document.getElementById('loginBtn');

document.getElementById('togglePwd').addEventListener('click', (e) => {
  e.preventDefault();
  if (pwdInput.type === 'password') { pwdInput.type = 'text'; e.target.textContent = '🙈'; }
  else { pwdInput.type = 'password'; e.target.textContent = '👁️'; }
});

async function login() {
  const password = pwdInput.value;
  if (!password) { showError('⚠️ أدخل كلمة المرور'); return; }

  loginBtn.disabled = true;
  loginBtn.textContent = '⏳...';
  try {
    await signInWithEmailAndPassword(auth, ADMIN_EMAIL, password);
    showError('');
  } catch (e) {
    let msg = '⚠️ كلمة المرور خاطئة';
    if (e.message.includes('user-not-found')) msg = '⚠️ لا يوجد حساب إداري';
    else if (e.message.includes('too-many-requests')) msg = '⚠️ محاولات كثيرة، انتظر قليلًا';
    showError(msg);
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'دخول';
  }
}

function showError(text) {
  if (text) { errorMsg.textContent = text; errorMsg.classList.add('show'); }
  else { errorMsg.classList.remove('show'); }
}

loginBtn.addEventListener('click', login);
pwdInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });

onAuthStateChanged(auth, (user) => {
  if (user) {
    loginScreen.style.display = 'none';
    dashboard.classList.add('show');
    loadBookings();
  } else {
    loginScreen.style.display = 'flex';
    dashboard.classList.remove('show');
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  signOut(auth).then(() => {
    pwdInput.value = '';
    showToast('👋 تم تسجيل الخروج', 'ok');
  });
});

async function loadBookings() {
  const container = document.getElementById('cardsContainer');
  container.innerHTML = '<div class="loading-text">⏳ جارٍ تحميل الطلبات...</div>';
  try {
    const snap = await getDocs(collection(db, BOOKINGS_COLLECTION));
    allBookings = [];
    snap.forEach(d => { allBookings.push({ id: d.id, ...d.data() }); });
    allBookings.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    updateStats();
    renderCards();
  } catch (e) {
    console.error(e);
    container.innerHTML = '<div class="empty-text">❌ فشل التحميل: ' + e.message + '</div>';
  }
}

function updateStats() {
  const total = allBookings.length;
  const pending = allBookings.filter(b => (b.status || 'pending') === 'pending').length;
  const approved = allBookings.filter(b => b.status === 'approved').length;
  const rejected = allBookings.filter(b => b.status === 'rejected').length;
  const revenue = allBookings.filter(b => b.status === 'approved').reduce((s, b) => s + (b.totalPrice || 0), 0);
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statApproved').textContent = approved;
  document.getElementById('statRejected').textContent = rejected;
  document.getElementById('statRevenue').textContent = '$' + revenue;
}

function renderCards() {
  const container = document.getElementById('cardsContainer');
  let filtered = allBookings;
  if (currentTab !== 'all') filtered = filtered.filter(b => (b.status || 'pending') === currentTab);
  if (currentSearch.trim()) {
    const s = currentSearch.trim().toLowerCase();
    filtered = filtered.filter(b =>
      (b.userName || '').toLowerCase().includes(s) ||
      (b.userPhone || '').toLowerCase().includes(s) ||
      (b.startCell !== undefined && b.startCell.toString().includes(s))
    );
  }
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-text">📭 لا توجد طلبات</div>';
    return;
  }
  container.innerHTML = '';
  filtered.forEach(b => {
    const card = document.createElement('div');
    card.className = 'card';
    const status = b.status || 'pending';
    const statusText = status === 'approved' ? '✅ مقبول' : status === 'rejected' ? '❌ مرفوض' : '⏳ قيد الانتظار';
    const statusClass = 'status-' + status;
    const date = b.timestamp ? new Date(b.timestamp).toLocaleString('ar-SY', { dateStyle: 'short', timeStyle: 'short' }) : '-';
    const cells = b.cellIndices ? b.cellIndices.length : (b.quantity || 1);
    const payMethod = b.paymentMethod === 'usdt' ? '🟡 USDT' : '🟢 شام كاش';
    const termsOk = b.termsAccepted ? '✅ موافق' : '❌ غير موافق';

    card.innerHTML = `
      <div class="card-header">
        <span class="card-id">🎯 #${(b.startCell !== undefined ? b.startCell : 0) + 1}</span>
        <span class="status-badge ${statusClass}">${statusText}</span>
      </div>
      <div class="card-info">
        <div class="info-item"><span class="label">👤 الاسم</span><span class="value">${escapeHtml(b.userName || '-')}</span></div>
        <div class="info-item"><span class="label">📱 الهاتف</span><span class="value">${escapeHtml(b.userPhone || '-')}</span></div>
        <div class="info-item"><span class="label">🔢 عدد المربعات</span><span class="value">${cells}</span></div>
        <div class="info-item"><span class="label">💰 المبلغ</span><span class="value">$${b.totalPrice || cells}</span></div>
        <div class="info-item"><span class="label">📐 الشبكة</span><span class="value">${b.gridShape ? b.gridShape.rows + '×' + b.gridShape.cols : '-'}</span></div>
        <div class="info-item"><span class="label">💳 طريقة الدفع</span><span class="value">${payMethod}</span></div>
        <div class="info-item"><span class="label">📜 الشروط</span><span class="value">${termsOk}</span></div>
        <div class="info-item"><span class="label">📅 التاريخ</span><span class="value">${date}</span></div>
        ${b.userNote ? `<div class="info-item"><span class="label">📝 تعليق</span><span class="value">${escapeHtml(b.userNote)}</span></div>` : ''}
      </div>
      <div class="card-images">
        ${b.selfieUrl ? `<div class="card-image"><span class="label">📸 السيلفي</span><img src="${b.selfieUrl}" onclick="showImage('${b.selfieUrl}')" loading="lazy"></div>` : ''}
        ${b.receiptUrl ? `<div class="card-image"><span class="label">🧾 الإيصال</span><img src="${b.receiptUrl}" onclick="showImage('${b.receiptUrl}')" loading="lazy"></div>` : ''}
      </div>
      <div class="card-actions">
        ${status !== 'approved' ? `<button class="btn-approve" onclick="approveBooking('${b.id}')">✅ قبول</button>` : ''}
        ${status !== 'rejected' ? `<button class="btn-reject" onclick="rejectBooking('${b.id}')">❌ رفض</button>` : ''}
        <button class="btn-delete" onclick="deleteBooking('${b.id}')">🗑️ حذف</button>
      </div>
    `;
    container.appendChild(card);
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

window.approveBooking = async (id) => {
  if (!confirm('هل تريد قبول هذا الحجز؟')) return;
  try {
    await updateDoc(doc(db, BOOKINGS_COLLECTION, id), { status: 'approved', approvedAt: Date.now() });
    showToast('✅ تم قبول الحجز', 'ok');
    loadBookings();
  } catch (e) { showToast('❌ فشل: ' + e.message, 'err'); }
};

window.rejectBooking = async (id) => {
  if (!confirm('هل تريد رفض هذا الحجز؟')) return;
  try {
    await updateDoc(doc(db, BOOKINGS_COLLECTION, id), { status: 'rejected', rejectedAt: Date.now() });
    showToast('❌ تم رفض الحجز', 'err');
    loadBookings();
  } catch (e) { showToast('❌ فشل: ' + e.message, 'err'); }
};

window.deleteBooking = async (id) => {
  if (!confirm('⚠️ هل أنت متأكد من الحذف النهائي؟')) return;
  try {
    await deleteDoc(doc(db, BOOKINGS_COLLECTION, id));
    showToast('🗑️ تم الحذف', 'ok');
    loadBookings();
  } catch (e) { showToast('❌ فشل: ' + e.message, 'err'); }
};

window.showImage = (url) => {
  const modal = document.getElementById('imageModal');
  document.getElementById('modalImg').src = url;
  modal.classList.add('show');
};

document.getElementById('imageModal').addEventListener('click', () => {
  document.getElementById('imageModal').classList.remove('show');
});

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.status;
    renderCards();
  });
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  currentSearch = e.target.value;
  renderCards();
});

document.getElementById('refreshBtn').addEventListener('click', () => {
  loadBookings();
  showToast('🔄 جارٍ التحديث...', 'ok');
});

function showToast(text, type = 'ok') {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.className = 'toast show ' + type;
  setTimeout(() => { toast.classList.remove('show'); }, 3000);
}

setInterval(() => { if (auth.currentUser) loadBookings(); }, 30000);
</script>

</body>
</html>
