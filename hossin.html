<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم حسين - إدارة الجدارية</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; text-align: center; }
        .login-container, .dashboard-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .hidden { display: none; }
        input { width: 80%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; text-align: center; font-size: 18px; }
        button { background: #28a745; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        .btn-reject { background: #dc3545; margin-right: 10px; }
        .order-card { background: #fff; border: 1px solid #ddd; padding: 15px; margin: 15px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .order-card img { max-width: 100%; max-height: 200px; border-radius: 6px; margin-bottom: 10px; }
    </style>
    <!-- روابط مكتبات Firebase الأساسية -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>

    <!-- شاشة الحماية الرقمية لحسين -->
    <div id="loginScreen" class="login-container">
        <h2>🔒 لوحة تحكم المسؤول</h2>
        <p>يرجى إدخال الرمز السري للدخول:</p>
        <input type="password" id="pinInput" placeholder="XXXX" maxlength="10">
        <br>
        <button onclick="checkPin()">دخول</button>
    </div>

    <!-- لوحة الإدارة الحية بعد تخطي الحماية -->
    <div id="dashboardScreen" class="dashboard-container hidden">
        <h2>👋 أهلاً بك يا حسين في لوحتك</h2>
        <p>الطلبات الجديدة المعلقة قيد الانتظار (Pending):</p>
        <hr>
        <div id="ordersList">جاري تحميل الطلبات المعلقة...</div>
    </div>

    <script>
        // تكوين Firebase الخاص بمشروعك (ضع بياناتك الحقيقية هنا)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // نظام الحماية الرقمي الخاص بك hossin9911
        function checkPin() {
            const pin = document.getElementById('pinInput').value;
            if(pin === 'hossin9911') {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').classList.remove('hidden');
                loadPendingOrders(); // تشغيل جلب البيانات فوراً
            } else {
                alert('الرمز السري غير صحيح المرجو المحاولة مرة أخرى.');
            }
        }

        // جلب الطلبات التي حالتها المعلقة Pending فقط من السحاب
        
        function loadPendingOrders() {
    db.collection("wall_orders").where("status", "==", "Pending")
    .onSnapshot((querySnapshot) => {
        const ordersList = document.getElementById('ordersList');
        ordersList.innerHTML = '';
        
        if(querySnapshot.empty) {
            ordersList.innerHTML = '<p>🎉 لا توجد طلبات معلقة حالياً، كل شيء نظيف!</p>';
            return;
        }

        querySnapshot.forEach((doc) => {
            const data = doc.data();
            const orderId = doc.id;

            const card = document.createElement('div');
            card.className = 'order-card';
            
            let receiptHTML = '';
            let paymentBadge = `<span class="badge-intl" style="background: #dee2e6; color: #495057; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;">💳 دفع دولي إلكتروني</span>`;
            
            if (data.paymentMethod === 'Local' || data.receiptUrl) {
                paymentBadge = `<span class="badge-local" style="background: #e2f0d9; color: #385723; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;">🇸🇾 تحويل محلي (شام كاش)</span>`;
                receiptHTML = `
                    <div class="image-box" style="flex: 1; min-width: 200px; max-width: 250px; text-align: center; display: inline-block; margin: 10px;">
                        <a href="${data.receiptUrl}" target="_blank">
                            <img src="${data.receiptUrl}" alt="إيصال تحويل شام كاش" style="max-width: 100%; max-height: 200px; border-radius: 6px; border: 1px solid #ccc;">
                        </a>
                        <p style="font-size: 12px; font-weight: bold; color: #555; margin-top: 5px;">🧾 إيصال تحويل شام كاش (اضغط للتكبير)</p>
                    </div>
                `;
            }

            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; direction: rtl;">
                    <strong>طلب رقم: #${orderId.substring(0,6)}</strong>
                    ${paymentBadge}
                </div>
                <div class="order-images" style="display: flex; gap: 15px; margin-bottom: 15px; justify-content: center; flex-wrap: wrap;">
                    <div class="image-box" style="flex: 1; min-width: 200px; max-width: 250px; text-align: center; display: inline-block; margin: 10px;">
                        <a href="${data.imageUrl}" target="_blank">
                            <img src="${data.imageUrl}" alt="سيلفي الزائر" style="max-width: 100%; max-height: 200px; border-radius: 6px; border: 1px solid #ccc;">
                        </a>
                        <p style="font-size: 12px; font-weight: bold; color: #555; margin-top: 5px;">📸 صورة سيلفي الزائر</p>
                    </div>
                    ${receiptHTML}
                </div>
                <p style="text-align: right; direction: rtl;"><strong>المساحة المطلوب حجزها:</strong> ${data.width} × ${data.height} (مربعات)</p>
                <p style="text-align: right; direction: rtl;"><strong>المبلغ المفترض استلامه:</strong> $${data.totalPrice}</p>
                <hr>
                <div style="text-align: center;">
                    <button onclick="approveOrder('${orderId}')" style="background: #28a745; color: white; border: none; padding: 10px 15px; font-size: 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">قبول وتثبيت الجدارية ✅</button>
                    <button class="btn-reject" onclick="rejectOrder('${orderId}', '${data.imagePath}', '${data.receiptPath || ''}')" style="background: #dc3545; color: white; border: none; padding: 10px 15px; font-size: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 10px;">رفض وإلغاء الطلب ❌</button>
                </div>
            `;
            ordersList.appendChild(card);
        });
    });
}


        // 1. في حال الضغط على قبول
        function approveOrder(orderId) {
            db.collection("wall_orders").document(orderId).update({
                status: "Approved"
            }).then(() => {
                alert("تم قبول الصورة بنجاح وتثبيتها في الجدارية علناً! 🎉");
            });
        }

        // 2. في حال الضغط على رفض واسترجاع ذاتي
        function rejectAndRefund(orderId, chargeId, imagePath) {
            if(confirm("هل أنت متأكد من رفض هذه الصورة؟ سيتم إعادة الأموال تلقائياً للمشتري وحذف البيانات.")) {
                
                // رابط الدالة الآمنة لـ Stripe لاسترجاع الأموال
                const refundUrl = `https://YOUR_REGION-YOUR_PROJECT_ID.cloudfunctions.net/refundPayment`;

                // إرسال طلب فوري لـ Stripe بالخلفية لإعادة المال للفيزا
                fetch(refundUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chargeId: chargeId })
                })
                .then(response => response.json())
                .then(result => {
                    if(result.success) {
                        // أ: حذف الصورة من المخزن السحابي (Storage) لتوفير المساحة
                        storage.ref(imagePath).delete();

                        // ب: حذف الطلب أو تصفير المربعات في قاعدة البيانات (Firestore) لفتحها مجدداً للزوار
                        db.collection("wall_orders").document(orderId).delete().then(() => {
                            alert("🚀 تم رفض الصورة بنجاح، وتم استرجاع المبلغ فورا للعميل بنجاح، وتحرير المربعات!");
                        });
                    } else {
                        alert("حدث خطأ أثناء استرجاع الأموال من Stripe: " + result.error);
                    }
                })
                .catch(err => {
                    alert("فشل الاتصال بخادم الاسترجاع، يرجى التحقق يدوياً.");
                    console.error(err);
                });
            }
        }
    </script>
</body>
</html>
